version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: ailifeos-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=ai-lifeos

  chromadb:
    image: chromadb/chroma:latest
    container_name: ailifeos-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mongodb_data:
  chromadb_data:
